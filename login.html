<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#252c4d">
    <title>Login - BIBLIOTECH</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

    <!-- HOTBAR -->
    <header class="hotbar">
        <a class="logo-home" href="./index.html" aria-label="Início">
            <img src="./source/image/logo.png" alt="BIBLIOTECH">
        </a>

        <nav class="hotbar-icons" aria-label="Navegação">
            <a href="./livros.html" title="Biblioteca" aria-label="Biblioteca">⌕</a>
            <a href="#" title="Configurações" aria-label="Configurações">⚙</a>
            <a href="./login.html" title="Minha conta" aria-label="Minha conta">👤</a>
        </nav>
    </header>

    <!-- BACKGROUND -->
    <div class="RENDER BACKGROUND" aria-hidden="true">
        <img src="./source/Arthur/home/Group 631.png" alt="">
    </div>

    <!-- LOGIN -->
    <main class="login-container">

        <!-- BACKEND: LOGIN -->
        <section class="login-box" id="login">
            <div class="logo-login">
                <img src="./source/image/logo.png" alt="BIBLIOTECH">
            </div>

            <div class="texto">
                <h1>Login</h1>
                <p>Entre na sua conta para acessar a Biblioteca Online.</p>
            </div>

            <!-- BACKEND: FORMULÁRIO DE LOGIN -->
            <form id="form-login" method="post">
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>

                <div class="opcoes">
                    <label>
                        <input type="checkbox" name="lembrar">
                        <span>Lembrar de mim</span>
                    </label>

                    <!-- BACKEND: RECUPERAÇÃO -->
                    <a href="#">Esqueci minha senha</a>
                </div>

                <!-- BACKEND: ENVIAR LOGIN -->
                <button type="submit">Entrar</button>
            </form>

            <div class="cadastro">
                <p>Não possui uma conta?</p>
                <a href="#cadastro" id="mostrar-cadastro">Criar conta</a>
            </div>
        </section>

        <!-- CADASTRO -->
        <section class="login-box cadastro-box" id="cadastro">
            <div class="logo-login">
                <img src="./source/image/logo.png" alt="BIBLIOTECH">
            </div>

            <div class="texto">
                <h1>Cadastro</h1>
                <p>Crie sua conta para acessar a Biblioteca Online.</p>
            </div>

            <!-- BACKEND: FORMULÁRIO DE CADASTRO -->
            <form id="form-cadastro" method="post">
                <div class="campo">
                    <label for="nome">Nome de usuário</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required>
                </div>

                <div class="campo">
                    <label for="email-cadastro">Email</label>
                    <input type="email" id="email-cadastro" name="email" placeholder="Digite seu email" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha-cadastro">Senha</label>
                    <input type="password" id="senha-cadastro" name="senha" placeholder="Digite sua senha" autocomplete="new-password" required>
                </div>

                <div class="campo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite sua senha novamente" autocomplete="new-password" required>
                </div>

                <!-- BACKEND: CADASTRAR USUÁRIO -->
                <button type="submit">Cadastrar</button>
            </form>

            <div class="cadastro">
                <p>Já possui uma conta?</p>
                <a href="#login" id="mostrar-login">Voltar para Login</a>
            </div>
        </section>
    </main>

    <script src="./javascript/login.js"></script>
</body>
</html>
